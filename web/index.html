<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AISENS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0f; color: #e8eaed; font-family: 'Inter', 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 16px 28px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid rgba(123,140,222,.15); flex-shrink: 0; }
    header h1 { font-size: 1.5rem; font-weight: 700; background: linear-gradient(135deg, #7b8cde, #a8b5ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 3px; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #4caf50; box-shadow: 0 0 6px #4caf50; animation: pulse 2s ease-in-out infinite; flex-shrink: 0; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .status-label { font-size: .75rem; color: #4caf50; background: rgba(76,175,80,.12); border: 1px solid rgba(76,175,80,.3); border-radius: 12px; padding: 2px 10px; }
    #chat { flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }
    #chat::-webkit-scrollbar { width: 5px; }
    #chat::-webkit-scrollbar-thumb { background: rgba(123,140,222,.25); border-radius: 3px; }
    .message { max-width: 80%; animation: slideIn .25s ease-out both; }
    @keyframes slideIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .message.user { align-self: flex-end; background: linear-gradient(135deg, #2d3575, #3d4fbc); border-radius: 18px 18px 4px 18px; padding: 12px 18px; line-height: 1.55; box-shadow: 0 3px 12px rgba(61,79,188,.25); }
    .message.bot { align-self: flex-start; display: flex; flex-direction: column; gap: 12px; }
    .summary-card { background: rgba(26,26,46,.8); border: 1px solid rgba(123,140,222,.18); border-radius: 14px; padding: 16px 20px; line-height: 1.7; backdrop-filter: blur(10px); }
    .summary-card.error { border-color: rgba(244,67,54,.3); background: rgba(40,10,10,.7); color: #ef9a9a; }
    .sources { display: flex; flex-direction: column; gap: 8px; }
    .sources-label { font-size: .72rem; text-transform: uppercase; letter-spacing: 1px; color: #7b8cde; margin-bottom: 2px; }
    .source-card { background: rgba(20,20,40,.6); border: 1px solid rgba(123,140,222,.12); border-radius: 10px; padding: 10px 14px; text-decoration: none; color: inherit; display: block; transition: border-color .2s, background .2s; }
    .source-card:hover { border-color: rgba(123,140,222,.4); background: rgba(30,30,60,.7); }
    .source-title { font-size: .88rem; font-weight: 600; color: #a8b5ff; margin-bottom: 3px; }
    .source-domain { font-size: .72rem; color: #888; margin-bottom: 4px; }
    .source-snippet { font-size: .8rem; color: #aaa; line-height: 1.5; }
    .typing { align-self: flex-start; background: rgba(26,26,46,.8); border: 1px solid rgba(123,140,222,.18); border-radius: 14px; padding: 14px 20px; display: flex; gap: 6px; align-items: center; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: #7b8cde; animation: bounce .9s ease-in-out infinite; }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
    #input-area { background: rgba(16,16,32,.9); border-top: 1px solid rgba(123,140,222,.12); padding: 16px 28px; display: flex; gap: 12px; align-items: flex-end; flex-shrink: 0; }
    #msg-input { flex: 1; background: rgba(26,26,46,.9); border: 1px solid rgba(123,140,222,.2); border-radius: 12px; color: #e8eaed; font-size: .95rem; padding: 12px 16px; resize: none; min-height: 46px; max-height: 140px; outline: none; transition: border-color .2s; font-family: inherit; line-height: 1.5; }
    #msg-input::placeholder { color: #555; }
    #msg-input:focus { border-color: rgba(123,140,222,.5); }
    #camera-btn { background: rgba(26,26,46,.9); border: 1px solid rgba(123,140,222,.3); border-radius: 12px; color: #a8b5ff; cursor: pointer; font-size: 1.2rem; padding: 0 14px; height: 46px; transition: background .2s, border-color .2s; align-self: flex-end; flex-shrink: 0; }
    #camera-btn:hover { background: rgba(123,140,222,.15); border-color: rgba(123,140,222,.6); }
    #camera-btn:disabled { opacity: .45; cursor: not-allowed; }
    #send-btn { background: linear-gradient(135deg, #3d4fbc, #7b8cde); border: none; border-radius: 12px; color: #fff; cursor: pointer; font-size: .9rem; font-weight: 600; padding: 12px 22px; transition: opacity .2s, transform .1s; white-space: nowrap; align-self: flex-end; height: 46px; }
    #send-btn:hover:not(:disabled) { opacity: .88; }
    #send-btn:active:not(:disabled) { transform: scale(.97); }
    #send-btn:disabled { opacity: .45; cursor: not-allowed; }
    .camera-snapshot { border-radius: 10px; max-width: 100%; border: 1px solid rgba(123,140,222,.25); margin-top: 4px; display: block; }
    .snapshot-label { font-size: .72rem; color: #7b8cde; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  </style>
</head>
<body>
  <header>
    <div class="status-dot"></div>
    <h1>AISENS</h1>
    <span class="status-label">&#128267; Live Search</span>
  </header>
  <div id="chat">
    <div class="message bot">
      <div class="summary-card">Hello! I'm <strong>AISENS</strong> &mdash; your AI assistant with real-time web search and camera vision.<br>Ask me about news, prices, weather, or say <em>"show me the camera"</em> to see what I see.</div>
    </div>
  </div>
  <div id="input-area">
    <textarea id="msg-input" placeholder="Ask anything... or say 'show me the camera'" rows="1"></textarea>
    <button id="camera-btn" title="Take a snapshot">&#128247;</button>
    <button id="send-btn">Send</button>
  </div>
  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const cameraBtn = document.getElementById('camera-btn');

    const VISION_KEYWORDS = ['camera', 'see', 'room', 'who is', 'look', 'snapshot', 'photo', 'image', 'capture', 'face', 'emotion', 'feeling', 'there anyone', 'anyone there', 'show me'];

    input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; });
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    sendBtn.addEventListener('click', sendMessage);
    cameraBtn.addEventListener('click', showSnapshot);

    function scrollToBottom() { chat.scrollTop = chat.scrollHeight; }

    function appendUserMessage(text) {
      const div = document.createElement('div');
      div.className = 'message user';
      div.textContent = text;
      chat.appendChild(div);
      scrollToBottom();
    }

    function showTyping() {
      const el = document.createElement('div');
      el.className = 'typing';
      el.id = 'typing-indicator';
      el.innerHTML = '<span></span><span></span><span></span>';
      chat.appendChild(el);
      scrollToBottom();
      return el;
    }

    function removeTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    function isCameraQuery(text) {
      const lower = text.toLowerCase();
      return VISION_KEYWORDS.some(kw => lower.includes(kw));
    }

    function appendSnapshot(wrapper) {
      const label = document.createElement('div');
      label.className = 'snapshot-label';
      label.textContent = 'Live camera snapshot';
      const img = document.createElement('img');
      img.className = 'camera-snapshot';
      img.src = '/snapshot?t=' + Date.now();
      img.alt = 'Camera snapshot';
      img.onerror = () => { label.textContent = 'Camera snapshot unavailable'; };
      wrapper.appendChild(label);
      wrapper.appendChild(img);
    }

    function appendBotMessage(data, showCamera) {
      removeTyping();
      const wrapper = document.createElement('div');
      wrapper.className = 'message bot';
      if (showCamera) appendSnapshot(wrapper);
      const summary = document.createElement('div');
      summary.className = 'summary-card';
      summary.textContent = data.summary || 'No answer available.';
      wrapper.appendChild(summary);
      if (data.sources && data.sources.length > 0) {
        const sourcesWrap = document.createElement('div');
        sourcesWrap.className = 'sources';
        const label = document.createElement('div');
        label.className = 'sources-label';
        label.textContent = 'Sources';
        sourcesWrap.appendChild(label);
        data.sources.forEach(src => {
          const a = document.createElement('a');
          a.className = 'source-card';
          a.href = src.url || '#';
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          const title = document.createElement('div');
          title.className = 'source-title';
          title.textContent = src.title || 'Untitled';
          a.appendChild(title);
          if (src.domain) { const d = document.createElement('div'); d.className = 'source-domain'; d.textContent = src.domain; a.appendChild(d); }
          if (src.snippet) { const s = document.createElement('div'); s.className = 'source-snippet'; s.textContent = src.snippet; a.appendChild(s); }
          sourcesWrap.appendChild(a);
        });
        wrapper.appendChild(sourcesWrap);
      }
      chat.appendChild(wrapper);
      scrollToBottom();
    }

    function appendErrorMessage(msg) {
      removeTyping();
      const wrapper = document.createElement('div');
      wrapper.className = 'message bot';
      const card = document.createElement('div');
      card.className = 'summary-card error';
      card.textContent = msg;
      wrapper.appendChild(card);
      chat.appendChild(wrapper);
      scrollToBottom();
    }

    async function showSnapshot() {
      cameraBtn.disabled = true;
      const wrapper = document.createElement('div');
      wrapper.className = 'message bot';
      appendSnapshot(wrapper);
      chat.appendChild(wrapper);
      scrollToBottom();
      setTimeout(() => { cameraBtn.disabled = false; }, 2000);
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      const showCamera = isCameraQuery(text);
      input.value = ''; input.style.height = 'auto';
      sendBtn.disabled = true; input.disabled = true;
      appendUserMessage(text);
      showTyping();
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const json = await res.json();
        if (!res.ok || json.type === 'error') {
          appendErrorMessage(json.message || 'Server error (' + res.status + ')');
        } else {
          appendBotMessage(json.data, showCamera);
        }
      } catch (err) {
        appendErrorMessage('Could not reach the server. Please try again.');
        console.error(err);
      } finally {
        sendBtn.disabled = false; input.disabled = false; input.focus();
      }
    }
  </script>
</body>
</html>

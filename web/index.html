<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AISENS - AI Search</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0a0a0f;color:#e8eaed;font-family:'Inter','Segoe UI',sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);padding:18px 28px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(123,140,222,.15);box-shadow:0 2px 12px rgba(0,0,0,.3)}header h1{font-size:1.6rem;font-weight:700;background:linear-gradient(135deg,#7b8cde,#a8b5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px}.status{background:rgba(76,175,80,.15);color:#4caf50;font-size:.7rem;padding:3px 11px;border-radius:14px;border:1px solid rgba(76,175,80,.3);animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}#chat{flex:1;overflow-y:auto;padding:28px;display:flex;flex-direction:column;gap:20px;scroll-behavior:smooth}#chat::-webkit-scrollbar{width:6px}#chat::-webkit-scrollbar-track{background:transparent}#chat::-webkit-scrollbar-thumb{background:rgba(123,140,222,.3);border-radius:3px}.message{max-width:78%;animation:slideIn .3s ease-out;opacity:0;animation-fill-mode:forwards}@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.message.user{align-self:flex-end;background:linear-gradient(135deg,#2d3575,#3d4fbc);border-radius:18px 18px 4px 18px;padding:14px 18px;box-shadow:0 3px 12px rgba(61,79,188,.25)}.message.user .text{line-height:1.5}.message.bot{align-self:flex-start;display:flex;flex-direction:column;gap:14px}.summary{background:rgba(26,26,46,.7);border:1px solid rgba(123,140,222,.15);border-radius:14px;padding:18px 22px;backdrop-filter:blur(10px);line-height:1.7;box-shadow:0 4px 16px rgba(0,0,0,.2)}.sources{display:flex;flex-direction:column;gap:10px}.source-card{background:rgba(26,26,46,.5);border:1px solid rgba(123,140,222,.12);border-radius:12px;padding:15px 18px;transition:all .25s ease;cursor:pointer;position:relative;overflow:hidden}.source-card:hover{border-color:rgba(123,140,222,.35);background:rgba(26,26,46,.75);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.3)}.source-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:linear-gradient(180deg,#7b8cde,#a8b5ff);opacity:0;transition:opacity .25s}.source-card:hover::before{opacity:1}.source-title{font-weight:600;font-size:.95rem;color:#a8b5ff;margin-bottom:7px;display:flex;align-items:center;gap:8px}.source-domain{font-size:.75rem;color:rgba(168,181,255,.6);background:rgba(123,140,222,.1);padding:2px 8px;border-radius:6px;font-family:monospace}.source-snippet{font-size:.88rem;color:rgba(232,234,237,.8);line-height:1.6;margin-bottom:8px}.source-url{font-size:.8rem;color:rgba(123,140,222,.7);text-decoration:none;word-break:break-all;transition:color .2s}.source-url:hover{color:#7b8cde}.thinking{background:rgba(26,26,46,.5);border:1px solid rgba(123,140,222,.12);border-radius:14px;padding:16px 20px;font-style:italic;color:rgba(232,234,237,.5);display:flex;align-items:center;gap:10px}.thinking-dot{width:6px;height:6px;background:rgba(123,140,222,.6);border-radius:50%;animation:bounce 1.4s ease-in-out infinite}.thinking-dot:nth-child(2){animation-delay:.2s}.thinking-dot:nth-child(3){animation-delay:.4s}@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}.input-bar{background:rgba(26,26,46,.8);border-top:1px solid rgba(123,140,222,.15);padding:20px 28px;display:flex;gap:14px;backdrop-filter:blur(12px)}#input{flex:1;background:rgba(15,15,26,.9);border:1px solid rgba(123,140,222,.25);border-radius:12px;padding:14px 18px;color:#e8eaed;font-size:1rem;outline:none;transition:all .25s;font-family:inherit}#input:focus{border-color:rgba(123,140,222,.6);box-shadow:0 0 0 3px rgba(123,140,222,.12)}#input::placeholder{color:rgba(232,234,237,.3)}#send{background:linear-gradient(135deg,#3d4fbc,#5060d0);color:#fff;border:none;border-radius:12px;padding:14px 28px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .25s;box-shadow:0 4px 12px rgba(61,79,188,.3)}#send:hover:not(:disabled){background:linear-gradient(135deg,#5060d0,#6070e0);transform:translateY(-1px);box-shadow:0 6px 16px rgba(61,79,188,.4)}#send:active{transform:translateY(0)}#send:disabled{background:rgba(42,42,74,.5);cursor:not-allowed;box-shadow:none}.timestamp{font-size:.7rem;color:rgba(232,234,237,.35);margin-top:6px;text-align:right}</style></head><body><header><h1>AISENS</h1><span class="status">online</span></header><div id="chat"><div class="message bot"><div class="summary">Hello! I'm AISENS, your AI assistant with real-time web search. Ask me anything!</div></div></div><div class="input-bar"><input id="input" placeholder="right" autocomplete="off"><button id="send">Send</button></div><script>const chat=document.getElementById('chat'),input=document.getElementById('input'),sendBtn=document.getElementById('send');let msgCount=0;function getTime(){const d=new Date();return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}function addMessage(content,type){msgCount++;const div=document.createElement('div');div.className='message '+type;div.style.animationDelay=(msgCount*.05)+'s';if(type==='user'){div.innerHTML=`<div class="text">${escapeHtml(content)}</div><div class="timestamp">${getTime()}</div>`}else if(type==='thinking'){div.className='thinking';div.innerHTML='<div class="thinking-dot"></div><div class="thinking-dot"></div><div class="thinking-dot"></div><span>AISENS is searching...</span>'}else if(type==='bot'){const data=content;let html='';if(data.summary){html+=`<div class="summary">${escapeHtml(data.summary)}</div>`}if(data.sources&&data.sources.length){html+='<div class="sources">';data.sources.forEach(src=>{html+=`<div class="source-card" onclick="window.open('${escapeHtml(src.url)}','_blank')"><div class="source-title">${escapeHtml(src.title||'Source')}${src.domain?'<span class="source-domain">'+escapeHtml(src.domain)+'</span>':''}</div><div class="source-snippet">${escapeHtml(src.snippet||'')}</div><a class="source-url" href="${escapeHtml(src.url)}" target="_blank" onclick="event.stopPropagation()">${escapeHtml(src.url)}</a></div>`});html+='</div>'}html+=`<div class="timestamp">${getTime()}</div>`;div.innerHTML=html}chat.appendChild(div);chat.scrollTop=chat.scrollHeight;return div}function escapeHtml(str){const div=document.createElement('div');div.textContent=str;return div.innerHTML}async function send(){const msg=input.value.trim();if(!msg)return;input.value='';sendBtn.disabled=true;addMessage(msg,'user');const thinking=addMessage(null,'thinking');try{const res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});const json=await res.json();chat.removeChild(thinking);if(json.type==='result'&&json.data){addMessage(json.data,'bot')}else{addMessage({summary:json.message||'Error occurred. Please try again.'},sources:[]},'bot')}}catch(e){chat.removeChild(thinking);addMessage({summary:'Connection error. Please check your internet and try again.',sources:[]},'bot')}sendBtn.disabled=false;input.focus()}sendBtn.addEventListener('click',send);input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});input.focus()</script></body></html>

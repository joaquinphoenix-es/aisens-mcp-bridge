<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AISENS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0f; color: #e8eaed; font-family: 'Inter', 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 16px 28px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid rgba(123,140,222,.18); }
    header h1 { font-size: 1.5rem; font-weight: 700; background: linear-gradient(135deg, #7b8cde, #a8b5ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #4caf50; box-shadow: 0 0 6px #4caf50; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .status-label { font-size: .75rem; color: #4caf50; background: rgba(76,175,80,.12); border: 1px solid rgba(76,175,80,.3); border-radius: 20px; padding: 3px 10px; }
    #chat { flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }
    #chat::-webkit-scrollbar { width: 5px; }
    #chat::-webkit-scrollbar-thumb { background: rgba(123,140,222,.25); border-radius: 3px; }
    .message { max-width: 80%; animation: slideIn .25s ease-out both; }
    @keyframes slideIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .message.user { align-self: flex-end; background: linear-gradient(135deg, #2d3575, #3d4fbc); border-radius: 18px 18px 4px 18px; padding: 12px 16px; }
    .message.bot { align-self: flex-start; display: flex; flex-direction: column; gap: 12px; }
    .summary-card { background: rgba(26,26,46,.8); border: 1px solid rgba(123,140,222,.18); border-radius: 14px; padding: 16px 20px; }
    .sources-label { font-size: .72rem; text-transform: uppercase; letter-spacing: 1px; color: #7b8cde; margin-bottom: 2px; }
    .answer-text { font-size: .97rem; line-height: 1.65; color: #d0d3e8; white-space: pre-wrap; }
    .camera-image { max-width: 100%; border-radius: 10px; border: 1px solid rgba(123,140,222,.3); margin-top: 8px; display: block; }
    .input-row { display: flex; align-items: flex-end; gap: 10px; padding: 16px 28px; background: rgba(26,26,46,.6); border-top: 1px solid rgba(123,140,222,.12); }
    #userInput { flex: 1; background: rgba(255,255,255,.06); border: 1px solid rgba(123,140,222,.25); border-radius: 14px; padding: 12px 16px; color: #e8eaed; font-size: .97rem; resize: none; min-height: 48px; max-height: 140px; outline: none; transition: border-color .2s; font-family: inherit; }
    #userInput:focus { border-color: rgba(123,140,222,.6); }
    .btn { height: 48px; border-radius: 12px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; transition: opacity .2s, transform .1s; padding: 0 16px; }
    .btn:hover { opacity: .85; }
    .btn:active { transform: scale(.95); }
    #sendBtn { background: linear-gradient(135deg, #3d4fbc, #5c6ef5); color: #fff; gap: 6px; font-size: .9rem; padding: 0 20px; }
    #cameraBtn { background: rgba(76,175,80,.15); border: 1px solid rgba(76,175,80,.3); color: #4caf50; font-size: 1.3rem; }
    .thinking { display: flex; gap: 5px; padding: 8px 0; }
    .thinking span { width: 8px; height: 8px; border-radius: 50%; background: #7b8cde; animation: bounce .9s infinite; }
    .thinking span:nth-child(2){animation-delay:.15s}
    .thinking span:nth-child(3){animation-delay:.3s}
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-7px)} }
  </style>
</head>
<body>
  <header>
    <div class="status-dot" id="statusDot"></div>
    <h1>AISENS</h1>
    <span class="status-label" id="statusLabel">Connecting...</span>
  </header>
  <div id="chat"></div>
  <div class="input-row">
    <textarea id="userInput" rows="1" placeholder="Type your message..."></textarea>
    <button class="btn" id="cameraBtn" title="Capture camera image">&#128247;</button>
    <button class="btn" id="sendBtn">Send &#9658;</button>
  </div>

  <script>
    const BRIDGE = '';
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const statusLabel = document.getElementById('statusLabel');
    const statusDot = document.getElementById('statusDot');
    let sessionId = localStorage.getItem('aisens_session') || ('s' + Date.now());
    localStorage.setItem('aisens_session', sessionId);

              // TTS: load voices robustly and prefer a British English female voice (Susan first)
      let _voicesCache = [];
      function _loadVoices() { _voicesCache = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
      if ('speechSynthesis' in window) {
        _loadVoices();
        window.speechSynthesis.addEventListener('voiceschanged', _loadVoices);
      }
      function _pickVoice() {
        const vs = _voicesCache && _voicesCache.length ? _voicesCache : (window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
        if (!vs || !vs.length) return null;
        const enGB = vs.filter(v => /en[-_]GB/i.test(v.lang));
        const byName = (list, rx) => list.find(v => rx.test(v.name));
        return (
          byName(enGB, /susan/i) ||
          byName(enGB, /libby/i) ||
          byName(enGB, /sonia/i) ||
          byName(enGB, /hazel/i) ||
          byName(enGB, /female|amy|emma|kate|serena|fiona|samantha|google uk english female/i) ||
          enGB[0] ||
          byName(vs, /^en.*female|samantha|google us english female/i) ||
          vs.find(v => /^en/i.test(v.lang)) ||
          null
        );
      }
      function speakText(text) {
        if (!('speechSynthesis' in window)) return;
        const speakNow = () => {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-GB';
          const v = _pickVoice();
          if (v) u.voice = v;
          window.speechSynthesis.speak(u);
        };
        if (!_voicesCache || !_voicesCache.length) {
          _loadVoices();
          if (!_voicesCache.length) {
            const onReady = () => { _loadVoices(); window.speechSynthesis.removeEventListener('voiceschanged', onReady); speakNow(); };
            window.speechSynthesis.addEventListener('voiceschanged', onReady);
            setTimeout(() => { _loadVoices(); if (_voicesCache.length) { try { window.speechSynthesis.removeEventListener('voiceschanged', onReady); } catch(e){} speakNow(); } }, 400);
            return;
          }
        }
        speakNow();
      }

    // ---- status check ----
    async function checkStatus() {
      try {
        const r = await fetch(BRIDGE + '/health', {method: 'GET'});
        const data = await r.json();
        if (data.status === 'ok') {
          statusLabel.textContent = 'Online';
          statusLabel.style.color = '#4caf50';
          statusLabel.style.borderColor = 'rgba(76,175,80,.3)';
          statusDot.style.background = '#4caf50';
          statusDot.style.boxShadow = '0 0 6px #4caf50';
        } else { throw new Error('not ok'); }
      } catch {
        statusLabel.textContent = 'Limited';
        statusLabel.style.color = '#ff9800';
        statusLabel.style.borderColor = 'rgba(255,152,0,.3)';
        statusDot.style.background = '#ff9800';
        statusDot.style.boxShadow = '0 0 6px #ff9800';
      }
    }
    checkStatus();

    // ---- helpers ----
    function appendMessage(role, text) {
      const wrap = document.createElement('div');
      wrap.className = 'message ' + role;
      if (role === 'bot') {
        const card = document.createElement('div');
        card.className = 'summary-card';
        const txt = document.createElement('div');
        txt.className = 'answer-text';
        txt.textContent = text;
        card.appendChild(txt);
        wrap.appendChild(card);
      } else {
        wrap.textContent = text;
      }
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
      return wrap;
    }

    function showThinking() {
      const wrap = document.createElement('div');
      wrap.className = 'message bot';
      wrap.id = 'thinking';
      wrap.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeThinking() {
      const t = document.getElementById('thinking');
      if (t) t.remove();
    }

    // ---- camera snapshot ----
    async function captureAndShow() {
      showThinking();
      try {
        const url = BRIDGE + '/snapshot?t=' + Date.now();
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const blob = await resp.blob();
        const objURL = URL.createObjectURL(blob);
        removeThinking();
        const wrap = document.createElement('div');
        wrap.className = 'message bot';
        const card = document.createElement('div');
        card.className = 'summary-card';
        card.innerHTML = '<div class="sources-label">Live Camera</div>' +
          '<img class="camera-image" src="' + objURL + '" alt="Snapshot" />' +
          '<div class="answer-text" style="margin-top:8px">Image captured from the AISENS camera.</div>';
        wrap.appendChild(card);
        chat.appendChild(wrap);
        chat.scrollTop = chat.scrollHeight;
      } catch (e) {
        removeThinking();
        appendMessage('bot', 'Could not retrieve camera image: ' + e.message);
      }
    }

    // ---- send message ----
    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      input.style.height = 'auto';
      appendMessage('user', text);
      const camKeys = ['camera', 'camara', 'photo', 'foto', 'image', 'imagen', 'snapshot', 'capture', 'captura', 'show', 'muestra', 'picture', 'see', 'ver'];
      if (camKeys.some(k => text.toLowerCase().includes(k))) {
        await captureAndShow();
        return;
      }
      showThinking();
      try {
        const r = await fetch(BRIDGE + '/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: text, session_id: sessionId})
        });
        const d = await r.json();
        removeThinking();
        const botText = (d.type === 'result' && d.data) ? (d.data.summary || 'No answer found.') : (d.message || JSON.stringify(d));
        appendMessage('bot', botText);
                    const srcs=(d.type==='result'&&d.data)?(d.data.sources||[]):[];if(srcs.length){const sc=document.createElement('div');sc.className='message bot';sc.innerHTML='<div class="summary-card"><div class="sources-label">Sources</div>'+srcs.map(s=>'<div class="answer-text"><a href="'+s.url+'" target="_blank" rel="noopener" style="color:#7b8cde;text-decoration:none;">'+(s.title||s.url)+'</a></div>').join('')+'</div>';chat.appendChild(sc);chat.scrollTop=chat.scrollHeight;}speakText(botText);
      } catch (e) {
        removeThinking();
        appendMessage('bot', 'Connection error: ' + e.message);
      }
    }

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('cameraBtn').addEventListener('click', captureAndShow);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AISENS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #1a1a2e;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2a2a4a;
    }
    header h1 {
      font-size: 1.4rem;
      color: #7b8cde;
      letter-spacing: 2px;
    }
    header span {
      font-size: 0.75rem;
      color: #4caf50;
      background: #1e3a1e;
      padding: 2px 8px;
      border-radius: 10px;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }
    .msg.user {
      background: #1e3a5f;
      color: #cde;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .msg.aisens {
      background: #1a1a2e;
      color: #e0e0e0;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
      border-left: 3px solid #7b8cde;
    }
    .msg.typing {
      color: #666;
      font-style: italic;
    }
    #inputArea {
      display: flex;
      padding: 16px 24px;
      gap: 12px;
      border-top: 1px solid #2a2a4a;
      background: #111;
    }
    #userInput {
      flex: 1;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 12px 16px;
      color: #e0e0e0;
      font-size: 0.95rem;
      resize: none;
      outline: none;
    }
    #userInput:focus { border-color: #7b8cde; }
    #sendBtn {
      background: #7b8cde;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    #sendBtn:hover { background: #5a6bbf; }
    #sendBtn:disabled { background: #333; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>AISENS</h1>
    <span>online</span>
  </header>
  <div id="chat"></div>
  <div id="inputArea">
    <textarea id="userInput" rows="2" placeholder="Ask AISENS something..."></textarea>
    <button id="sendBtn">Send</button>
  </div>
  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const btn = document.getElementById('sendBtn');

    function addMsg(text, role) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      btn.disabled = true;
      addMsg(text, 'user');
      const typing = addMsg('AISENS is thinking...', 'aisens typing');
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        typing.remove();
        addMsg(data.reply || 'No response received.', 'aisens');
      } catch (e) {
        typing.remove();
        addMsg('Connection error. Please try again.', 'aisens');
      }
      btn.disabled = false;
      input.focus();
    }

    btn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    addMsg('Hello! I am AISENS, your AI assistant with internet access. How can I help you today?', 'aisens');
  </script>
</body>
</html>
